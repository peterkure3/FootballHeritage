name: Publication synchronization
on:
  pull_request:
    paths:
      - 'pipeline/sync/**'
      - 'pipeline/migrations/00[23]*'
      - 'pipeline/tests/test_publication_sync.py'
      - 'pipeline/tests/test_sync_supervisor.py'
      - 'pipeline/tests/test_rust_pick_contract.py'
      - 'backend/tests/fixtures/ai_pick_selection_contract.json'
      - 'pipeline/api/ai_picks.py'
      - 'pipeline/requirements-sync.txt'
      - 'scripts/*publication*.py'
      - 'backend/migrations/20261026000001_published_data.sql'
      - '.github/workflows/publication-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: publication_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: publication_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PUBLICATION_TEST_DATABASE_URL: postgresql://publication_test:test-only-password@127.0.0.1:5432/publication_tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r pipeline/requirements-sync.txt ruff==0.17.2
      - run: ruff check pipeline/sync pipeline/tests/test_publication_sync.py scripts/run_publication_tests.py scripts/apply_local_publication_migrations.py
      - run: ruff format --check pipeline/sync pipeline/tests/test_publication_sync.py scripts/run_publication_tests.py scripts/apply_local_publication_migrations.py
      - run: python scripts/run_publication_tests.py
      - run: python -m unittest discover -s tests -p test_sync_supervisor.py -v
        working-directory: pipeline
      - run: python -m unittest discover -s tests -p test_rust_pick_contract.py -v
        working-directory: pipeline
