name: Production readiness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feature-policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feature_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: feature_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SQLX_OFFLINE: 'true'
      FEATURE_TEST_DATABASE_URL: postgresql://feature_test:test-only-password@localhost:5432/feature_tests
      RUSTFLAGS: '-C target-cpu=x86-64'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked --bin football-heritage-backend
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/production-policy.test.mjs
      - run: npm run build:production
        env:
          VITE_API_URL: https://api.example.test/api/v1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/feature-management.spec.js --project=chromium --reporter=line
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi==0.115.6 httpx==0.28.1 python-dotenv==1.0.1
      - run: python -m unittest discover -s tests -p test_gateway_access.py -v
      - run: python -m unittest discover -s tests -p test_production_database_config.py -v
