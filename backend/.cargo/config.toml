[build]
# @vercel/rust reads build.target without guarding a missing build table.
# Keep the host default; forcing Linux here would break Windows development.

[env]
# Deploy builds use the checked-in .sqlx cache, never a live database.
SQLX_OFFLINE = "true"

[target.x86_64-pc-windows-msvc]
# Windows-specific optimizations
rustflags = [
    "-C", "target-cpu=native",
]

[target.x86_64-unknown-linux-gnu]
# Linux-specific optimizations
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-fuse-ld=lld",  # Use faster linker if available
]

# Keep development artifacts bounded on constrained workstations.
[profile.dev]
incremental = false
debug = 0

[profile.test]
incremental = false
debug = 0

# Optimize dependencies even in dev mode
[profile.dev.package."*"]
opt-level = 2

# Net settings to reduce download times
[net]
git-fetch-with-cli = false

# Registry settings
[registries.crates-io]
protocol = "sparse"
